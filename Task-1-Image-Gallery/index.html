<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <!-- Categories -->
    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="city">City</button>
        <button class="filter-btn" data-category="animals">Animals</button>
    </div>

    <!-- Gallery -->
    <main class="gallery">

        <!-- Nature Images -->
        <div class="gallery-item" data-category="nature">
            <img src="images/nature/forrest.jpg" alt="Forest">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="images/nature/mointain.jpg" alt="Mountain">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="images/nature/waterfall.jpg" alt="Waterfall">
        </div>

        <!-- City Images (add city1.jpg, city2.jpg, city3.jpg to images/city/) -->
        <div class="gallery-item" data-category="city">
            <img src="images/city/cityskyline.jpg" alt="City Skyline">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="images/city/nightcity .jpg" alt="Night City">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="images/city/urban street.jpg" alt="Urban Street">
        </div>

        <!-- Animals Images (add animal1.jpg, animal2.jpg, animal3.jpg to images/animals/) -->
        <div class="gallery-item" data-category="animals">
            <img src="images/animals/marc-olivier-jodoin-tauPAnOIGvE-unsplash.jpg" alt="Animal 1">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="images/animals/mariola-grobelska-8a7ZTFKax_I-unsplash.jpg" alt="Animal 2">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="images/animals/mathew-schwartz-dJb4w5hy0OA-unsplash.jpg" alt="Animal 3">
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="Large image">

        <button class="next" id="next">&#10095;</button>

    </div>

    <script src="script.js"></script>
</body>

</html>
