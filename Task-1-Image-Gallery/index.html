<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="/Task-1-Image-Gallery/style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <!-- Categories -->
    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="city">City</button>
        <button class="filter-btn" data-category="animals">Animals</button>
    </div>

    <!-- Gallery -->
    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/id/1018/600/400" alt="Nature">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/id/1011/600/400" alt="City">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/id/1025/600/400" alt="Animal">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/id/1031/600/400" alt="City">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/id/237/600/400" alt="Dog">
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="Large image">

        <button class="next" id="next">&#10095;</button>

    </div>

    <script src="/Task-1-Image-Gallery/script.js"></script>
</body>

</html>
